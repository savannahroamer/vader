<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Weather service</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
  <main class="container py-5">

    <!-- Search part -->
    <section class="row justify-content-center">
      <div class="col-lg-8 text-center">
        <h1 class="display-4 fw-light">Weather Service</h1>
        <p class="lead text-muted">We'll fetch the weather for you! Where do you want to know the weather?</p>

        <div class="row g-3 mt-2">
          <div class="col-sm-6">
            <button id="myLocation" class="btn btn-primary btn-lg w-100" type="button">My location!</button>
          </div>
          <div class="col-sm-6">
            <input id="city" class="form-control form-control-lg" type="text" placeholder="Enter city here..." aria-label="City">
          </div>
        </div>

        <div id="result" class="mt-4"></div>
      </div>
    </section>

    <hr class="my-5">

    <!-- Latest searches part -->
    <section class="row justify-content-center">
      <div class="col-lg-8 text-center">
        <h2 class="display-5 fw-light">Latest requests</h2>
        <p class="text-muted">We remember your last five requests for you :)</p>
        <hr>
        <div id="history"></div>
      </div>
    </section>

  </main>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
